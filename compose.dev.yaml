name: cashly-backend-dev
services:
  backend:
    image: cashly-backend:dev
    build:
      context: .
    env_file: ./.env.dev
    environment:
      CASHLY_ENV: dev
      CASHLY_ENV_SOURCE: system
      HOST: 0.0.0.0
      PORT: "8000"
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    command: [python, -m, cashly.dev_container]
    volumes:
      - ./src:/app/src
    ports:
      - "127.0.0.1:8000:8000"
    networks: [cashly]

networks:
  cashly:
    name: cashly-dev
    external: true
