# All local tooling belongs to the backend repository (ADR-0068).
project_id = "cashly-backend-local"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
shadow_port = 54320
major_version = 17
# Alembic owns the Cashly schema; Supabase owns auth.users.
[db.migrations]
enabled = false
[db.seed]
enabled = false
[studio]
enabled = true
port = 54323
[local_smtp]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
[auth.email]
enabled = true
enable_confirmations = false
double_confirm_changes = true
[realtime]
enabled = false
[storage]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
